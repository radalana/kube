apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: falco-ref-exec-dev-shm-v4-candidate
  annotations:
    thesis.fh/reference-rule: Execution from /dev/shm
    thesis.fh/mapping-status: candidate
spec:
  lsmhooks:
    - hook: bprm_check_security
      args:
        - index: 0
          type: linux_binprm
          label: binary
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /dev/shm/
          matchActions:
            - action: Post
