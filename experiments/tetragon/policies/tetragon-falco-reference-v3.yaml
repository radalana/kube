# Tetragon v1.7.0 Falco-reference policy bundle, revision v3.1.
#
# Fix from v3:
# matchPIDs.values must be integers according to the installed Tetragon CRD.
# The terminal-shell policy therefore uses values: [1] instead of values: ["1"].
#
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: falco-ref-directory-traversal-read
  annotations:
    thesis.fh/reference-rule: Directory traversal monitored file read
    thesis.fh/mapping-status: partial
spec:
  kprobes:
  - call: sys_open
    syscall: true
    args:
    - index: 0
      type: string
      label: raw_path
    - index: 1
      type: int
      label: flags
    selectors:
    - matchArgs:
      - index: 0
        operator: SubString
        values:
        - ../
      - index: 0
        operator: SubString
        values:
        - /etc/
        - /.ssh/
        - id_rsa
      matchActions:
      - action: Post
  - call: sys_openat
    syscall: true
    args:
    - index: 0
      type: int
      label: dirfd
    - index: 1
      type: string
      label: raw_path
    - index: 2
      type: int
      label: flags
    selectors:
    - matchArgs:
      - index: 1
        operator: SubString
        values:
        - ../
      - index: 1
        operator: SubString
        values:
        - /etc/
        - /.ssh/
        - id_rsa
      matchActions:
      - action: Post
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: falco-ref-sensitive-read-trusted
  annotations:
    thesis.fh/reference-rule: Read sensitive file trusted after startup
    thesis.fh/mapping-status: partial
spec:
  kprobes:
  - call: security_file_permission
    syscall: false
    args:
    - index: 0
      type: file
      label: file
    - index: 1
      type: int
      label: mask
    selectors:
    - matchBinaries:
      - operator: Postfix
        values:
        - /nginx
        - /httpd
        - /apache
        - /apache2
        - /mysqld
        - /postgres
        - /sqlplus
      matchArgs:
      - index: 0
        operator: Equal
        values:
        - /etc/shadow
        - /etc/sudoers
        - /etc/pam.conf
        - /etc/security/pwquality.conf
      - index: 1
        operator: Equal
        values:
        - '4'
      matchActions:
      - action: Post
    - matchBinaries:
      - operator: Postfix
        values:
        - /nginx
        - /httpd
        - /apache
        - /apache2
        - /mysqld
        - /postgres
        - /sqlplus
      matchArgs:
      - index: 0
        operator: Prefix
        values:
        - /etc/sudoers.d/
        - /etc/pam.d/
      - index: 1
        operator: Equal
        values:
        - '4'
      matchActions:
      - action: Post
---
