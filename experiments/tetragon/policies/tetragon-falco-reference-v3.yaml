      label: filename
    - index: 4
      type: int
      label: flags
    selectors:
    - matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - host_ns
      matchPIDs:
      - operator: NotIn
        followForks: false
        isNamespacePID: true
        values:
