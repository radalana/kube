      batch.kubernetes.io/controller-uid: 0fdb71f7-d008-41f3-a53f-76ebb601d72d
  suspend: false
  template:
    metadata:
      labels:
        batch.kubernetes.io/controller-uid: 0fdb71f7-d008-41f3-a53f-76ebb601d72d
        batch.kubernetes.io/job-name: g3-backup
        controller-uid: 0fdb71f7-d008-41f3-a53f-76ebb601d72d
        experiment: benign
        job-name: g3-backup
        scenario: g3-backup
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          set -eu

          echo "Starting authorized logical backup"

          mariadb-dump \
            --protocol=TCP \
            --host=mariadb-galera.database.svc.cluster.local \
            --port=3306 \
            --user=backupuser \
            --password="$BACKUP_PASSWORD" \
            --single-transaction \
            --skip-lock-tables \
            --skip-add-locks \
            --triggers \
            appdb > /backup/appdb.sql

          test -s /backup/appdb.sql

          echo "Backup completed successfully"
          echo "Backup file: /backup/appdb.sql"

          echo "Backup size in bytes:"
          wc -c < /backup/appdb.sql

          echo "Backup checksum:"
          sha256sum /backup/appdb.sql

          echo "Database statements found in dump:"
          grep -cE '^(CREATE TABLE|INSERT INTO|CREATE.*VIEW)' \
            /backup/appdb.sql || true

          echo "First lines of backup:"
          head -n 10 /backup/appdb.sql
        env:
        - name: BACKUP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: backup-password
        image: mariadb:11.8
        imagePullPolicy: IfNotPresent
        name: mariadb-backup-client
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /backup
          name: backup-data
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
