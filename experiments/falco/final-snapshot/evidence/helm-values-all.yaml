COMPUTED VALUES:
affinity: {}
certs:
  ca:
    crt: ""
  client:
    crt: ""
    key: ""
  existingClientSecret: ""
  existingSecret: ""
  server:
    crt: ""
    key: ""
collectors:
  containerEngine:
    enabled: true
    engines:
      bpm:
        enabled: true
      containerd:
        enabled: true
        sockets:
        - /run/host-containerd/containerd.sock
      cri:
        enabled: true
        sockets:
        - /run/containerd/containerd.sock
        - /run/crio/crio.sock
        - /run/k3s/containerd/containerd.sock
        - /run/host-containerd/containerd.sock
      docker:
        enabled: true
        sockets:
        - /var/run/docker.sock
      libvirt_lxc:
        enabled: true
      lxc:
        enabled: true
      podman:
        enabled: true
        sockets:
        - /run/podman/podman.sock
    hooks:
    - create
    labelMaxLen: 100
    pluginRef: ghcr.io/falcosecurity/plugins/plugin/container:0.7.1
    withSize: false
  enabled: true
  kubernetes:
    collectorHostname: ""
    collectorPort: ""
    enabled: false
    hostProc: /host
    pluginRef: ghcr.io/falcosecurity/plugins/plugin/k8smeta:0.4.1
    verbosity: info
containerSecurityContext: {}
controller:
  annotations: {}
  daemonset:
    updateStrategy:
      type: RollingUpdate
  deployment:
    replicas: 1
  kind: daemonset
  labels: {}
customRules: {}
driver:
  enabled: true
  kind: modern_ebpf
  kmod:
    bufSizePreset: 4
    dropFailedExit: false
  loader:
    enabled: true
    initContainer:
      args: []
      env: []
      image:
        pullPolicy: IfNotPresent
        registry: docker.io
        repository: falcosecurity/falco-driver-loader
        tag: ""
      resources: {}
      securityContext: {}
  modernEbpf:
    bufSizePreset: 4
    cpusForEachBuffer: 2
    disableIterators: false
    dropFailedExit: false
    leastPrivileged: false
    sysfsMount: true
  sysfsMountPath: /sys/kernel
extra:
  args: []
  env: []
  initContainers: []
falco:
  append_output:
  - suggested_output: true
  base_syscalls:
    all: false
    custom_set: []
    repair: false
  buffer_format_base64: false
  buffered_outputs: false
  capture:
    default_duration: 5000
    enabled: false
    mode: rules
    path_prefix: /tmp/falco
  config_files:
  - /etc/falco/config.d
  falco_libs:
    snaplen: 80
    thread_table_auto_purging_interval_s: 300
    thread_table_auto_purging_thread_timeout_s: 300
    thread_table_size: 262144
  file_output:
    enabled: false
    filename: ./events.txt
    keep_alive: false
  http_output:
    ca_bundle: ""
    ca_cert: ""
    ca_path: /etc/falco/certs/
    client_cert: /etc/falco/certs/client/client.crt
    client_key: /etc/falco/certs/client/client.key
    compress_uploads: false
    echo: false
    enabled: false
    insecure: false
    keep_alive: false
    max_consecutive_timeouts: 5
    mtls: false
    url: ""
    user_agent: falcosecurity/falco
  json_include_message_property: false
  json_include_output_fields_property: true
  json_include_output_property: true
  json_include_tags_property: true
  json_output: false
  libs_logger:
    enabled: true
    severity: info
  load_plugins: []
  log_level: info
  log_stderr: true
  log_syslog: true
  output_timeout: 2000
  outputs_queue:
    capacity: 0
  plugins: []
  plugins_hostinfo: true
  priority: debug
  program_output:
    enabled: false
    keep_alive: false
    program: 'jq ''{text: .output}'' | curl -d @- -X POST https://hooks.slack.com/services/XXX'
  rule_matching: first
  rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/rules.d
  stdout_output:
    enabled: true
  syscall_event_drops:
    actions:
    - log
    - alert
    max_burst: 1
    rate: 0.03333
    simulate_drops: false
    threshold: 0.1
  syscall_event_timeouts:
    max_consecutives: 1000
  syslog_output:
    enabled: true
  time_format_iso_8601: false
  watch_config_files: true
  webserver:
    enabled: true
    k8s_healthz_endpoint: /healthz
    listen_address: 0.0.0.0
    listen_port: 8765
    prometheus_metrics_enabled: false
    ssl_certificate: /etc/falco/falco.pem
    ssl_enabled: false
    threadiness: 0
falco-talon: {}
falcoHostnameEnv: true
falcoctl:
  artifact:
    follow:
      args:
      - --log-format=json
      enabled: false
      env: []
      envFrom: []
      mounts:
        volumeMounts: []
      resources: {}
      securityContext: {}
    install:
      args:
      - --log-format=json
      enabled: true
      env: []
      envFrom: []
      mounts:
        volumeMounts: []
      resources: {}
      securityContext: {}
  config:
    artifact:
      allowedTypes:
      - rulesfile
      - plugin
      follow:
        every: 168h
        falcoversions: http://localhost:8765/versions
        pluginsDir: /plugins
        refs:
        - falco-rules:5
        rulesfilesDir: /rulesfiles
        stateDir: /artifactstate
      install:
        pluginsDir: /plugins
        refs:
        - falco-rules:5
        resolveDeps: true
        rulesfilesDir: /rulesfiles
        stateDir: /artifactstate
    indexes:
    - name: falcosecurity
      url: https://falcosecurity.github.io/falcoctl/index.yaml
  image:
    pullPolicy: IfNotPresent
    registry: docker.io
    repository: falcosecurity/falcoctl
    tag: 0.13.0
falcosidekick:
  enabled: false
  fullfqdn: false
  listenPort: ""
fullnameOverride: ""
grafana:
  dashboards:
    configMaps:
      falco:
        folder: ""
        folderAnnotation: grafana_dashboard_folder
        name: falco-grafana-dashboard
        namespace: ""
    enabled: false
healthChecks:
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
  startupProbe:
    failureThreshold: 20
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 5
image:
  pullPolicy: IfNotPresent
  registry: docker.io
  repository: falcosecurity/falco
  tag: 0.44.1
imagePullSecrets: []
metrics:
  convertMemoryToMB: true
  enabled: false
  includeEmptyValues: false
  interval: 1h
  jemallocStatsEnabled: false
  kernelEventCountersEnabled: true
  kernelEventCountersPerCPUEnabled: false
  kernelIterEventCountersEnabled: true
  libbpfStatsEnabled: true
  outputRule: false
  pluginsMetricsEnabled: true
  resourceUtilizationEnabled: true
  rulesCountersEnabled: true
  service:
    annotations: {}
    create: true
    labels: {}
    ports:
      metrics:
        ipFamilies: []
        ipFamilyPolicy: ""
        port: 8765
        protocol: TCP
        targetPort: 8765
    type: ClusterIP
  stateCountersEnabled: true
mounts:
  volumeMounts: []
  volumes: []
nameOverride: ""
namespaceOverride: ""
nodeSelector: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
rbac:
  create: true
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 512Mi
responseActions:
  enabled: false
scc:
  create: true
serviceAccount:
  annotations: {}
  create: true
  imagePullSecrets: []
  name: ""
serviceMonitor:
  create: false
  endpointPort: metrics
  interval: 15s
  labels: {}
  path: /metrics
  relabelings: []
  scheme: http
  scrapeTimeout: 10s
  selector: {}
  targetLabels: []
  tlsConfig: {}
tolerations:
- effect: NoSchedule
  key: node-role.kubernetes.io/master
- effect: NoSchedule
  key: node-role.kubernetes.io/control-plane
tty: true
