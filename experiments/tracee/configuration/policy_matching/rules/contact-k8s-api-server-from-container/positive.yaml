apiVersion: v1
kind: Pod
metadata:
  name: tracee-k8s-api-positive
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          echo "KUBERNETES_SERVICE_HOST=$KUBERNETES_SERVICE_HOST"
          wget -qO- --no-check-certificate \
            "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/version" || true
          sleep 3