apiVersion: v1
kind: Pod
metadata:
  name: tracee-k8s-api-negative
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          echo "Connecting to MariaDB, not Kubernetes API"
          wget -qO- \
            http://mariadb-galera.database.svc.cluster.local:3306 || true
          sleep 3