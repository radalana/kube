apiVersion: v1
kind: Pod
metadata:
  name: clearlog-pos
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          echo "before" > /var/log/tracee-clear-test.log
          sleep 1
          : > /var/log/tracee-clear-test.log
          echo "log cleared"
          sleep 3