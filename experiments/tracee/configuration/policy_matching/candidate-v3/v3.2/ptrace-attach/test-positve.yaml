apiVersion: v1
kind: Pod
metadata:
  name: ptr-pos
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: python:3.13-alpine
      securityContext:
        capabilities:
          add:
            - SYS_PTRACE
      command:
        - python3
        - -c
        - |
          import ctypes
          import os
          import signal
          import time

          libc = ctypes.CDLL(None, use_errno=True)
          libc.ptrace.argtypes = [
              ctypes.c_uint,
              ctypes.c_uint,
              ctypes.c_void_p,
              ctypes.c_void_p
          ]
          libc.ptrace.restype = ctypes.c_long

          PTRACE_ATTACH = 16
          PTRACE_DETACH = 17

          child = os.fork()

          if child == 0:
              time.sleep(10)
              os._exit(0)

          time.sleep(1)

          ret = libc.ptrace(PTRACE_ATTACH, child, None, None)
          err = ctypes.get_errno()

          print(f"PTRACE_ATTACH ret={ret} errno={err} child={child}", flush=True)

          if ret == 0:
              os.waitpid(child, 0)
              libc.ptrace(PTRACE_DETACH, child, None, None)
          else:
              os.kill(child, signal.SIGTERM)
              os.waitpid(child, 0)

          time.sleep(3)