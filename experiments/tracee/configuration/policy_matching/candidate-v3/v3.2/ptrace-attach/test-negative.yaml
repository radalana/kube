apiVersion: v1
kind: Pod
metadata:
  name: ptr-neg
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: python:3.13-alpine
      command:
        - python3
        - -c
        - |
          import ctypes
          import time

          libc = ctypes.CDLL(None, use_errno=True)

          PTRACE_TRACEME = 0

          ret = libc.ptrace(PTRACE_TRACEME, 0, None, None)
          err = ctypes.get_errno()

          print(f"PTRACE_TRACEME ret={ret} errno={err}", flush=True)
          time.sleep(3)