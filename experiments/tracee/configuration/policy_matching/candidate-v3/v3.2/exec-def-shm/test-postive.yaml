apiVersion: v1
kind: Pod
metadata:
  name: shm-pos
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          cp /bin/busybox /dev/shm/busybox
          chmod +x /dev/shm/busybox
          /dev/shm/busybox echo "executed from dev shm"
          sleep 3