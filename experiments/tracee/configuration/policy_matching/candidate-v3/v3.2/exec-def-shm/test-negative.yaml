apiVersion: v1
kind: Pod
metadata:
  name: shm-neg
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          cp /bin/busybox /tmp/busybox
          chmod +x /tmp/busybox
          /tmp/busybox echo "executed from tmp"
          sleep 3