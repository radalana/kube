apiVersion: v1
kind: Pod
metadata:
  name: tracee-private-key-positive
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          echo "-----BEGIN RSA PRIVATE KEY-----" > /tmp/test-key
          grep "BEGIN RSA PRIVATE" /tmp/test-key
          sleep 3