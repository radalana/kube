apiVersion: v1
kind: Pod
metadata:
  name: tracee-ssh-listener
  namespace: default
  labels:
    app: tracee-ssh-listener
spec:
  nodeName: worker1
  containers:
    - name: port-4444
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "test listener 4444" | nc -l -p 4444 || true
          done

    - name: port-2222
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "test listener 2222" | nc -l -p 2222 || true
          done
---
apiVersion: v1
kind: Service
metadata:
  name: tracee-ssh-listener
  namespace: default
spec:
  selector:
    app: tracee-ssh-listener
  ports:
    - name: positive
      port: 4444
      targetPort: 4444
    - name: negative
      port: 2222
      targetPort: 2222