apiVersion: v1
kind: Pod
metadata:
  name: tracee-aws-positive
  namespace: default
spec:
  nodeName: worker1
  restartPolicy: Never
  containers:
    - name: test
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          echo "aws_access_key_id = TEST" > /tmp/aws-config
          grep "aws_access_key_id" /tmp/aws-config
          sleep 3