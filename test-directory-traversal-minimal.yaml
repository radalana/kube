apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: test-directory-traversal-minimal

spec:
  kprobes:

  - call: sys_open
    syscall: true
    args:
    - index: 0
      type: string
      label: raw_path
    - index: 1
      type: int
      label: flags
    selectors:
    - matchArgs:
      - index: 0
        operator: SubString
        values:
        - "../"
      matchActions:
      - action: Post

  - call: sys_openat
    syscall: true
    args:
    - index: 0
      type: int
      label: dirfd
    - index: 1
      type: string
      label: raw_path
    - index: 2
      type: int
      label: flags
    selectors:
    - matchArgs:
      - index: 1
        operator: SubString
        values:
        - "../"
      matchActions:
      - action: Post